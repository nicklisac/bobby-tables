<!DOCTYPE html>
<html>
<head><title>JSPI Test — ESM build</title></head>
<body>
<pre id="log"></pre>
<script type="module">
const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; console.log(msg); };

log('Loading sqlite3.mjs (ESM build, no bundler)...');

try {
  const mod = await import('./vendor/sqlite-wasm-jspi/dist/sqlite3.mjs');
  const sqlite3InitModule = mod.default;

  log('Initializing SQLite WASM...');
  const sqlite3 = await sqlite3InitModule({
    locateFile: (f) => {
      if (f === 'sqlite3.wasm') return './vendor/sqlite-wasm-jspi/dist/sqlite3.wasm';
      return f;
    },
  });

  log('✓ SQLite initialized! Version: ' + sqlite3.version.libVersion);

  const db = new sqlite3.oo1.DB(':memory:');
  db.exec('CREATE TABLE test (id INTEGER, name TEXT)');
  db.exec("INSERT INTO test VALUES (1, 'hello')");
  const result = db.exec('SELECT * FROM test');
  log('✓ Query: ' + JSON.stringify(result));

  // Test recursive triggers (needed for the agent)
  db.exec('PRAGMA recursive_triggers = ON;');
  log('✓ Recursive triggers enabled');
  log('✓ ALL TESTS PASSED!');

} catch (e) {
  log('✗ ERROR: ' + e.message);
  log('Stack: ' + e.stack);
}
</script>
</body>
</html>
